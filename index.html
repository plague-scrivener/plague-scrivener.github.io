<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说标题</title>
<style>
/* 全局重置 */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 
  字体：优先使用各平台最优中文阅读字体
  字号：18px（中文长文黄金尺寸，不大不小）
  行高：1.8（小说阅读最佳行距）
*/
body {
  background: #ffffff;
  color: #1a1a1a;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  font-size: 18px;
  line-height: 1.8;
  padding: 60px 20px;
}

/* 容器：限制宽度，居中，模拟书本阅读区 */
.container {
  max-width: 640px;
  margin: 0 auto;
}

/* 标题 */
h1 {
  font-size: 28px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}

/* 作者 */
.author {
  text-align: center;
  font-size: 16px;
  color: #666;
  margin-bottom: 60px;
}

/* 索引列表 */
.index {
  list-style: none;
}

.index li {
  margin-bottom: 16px;
  display: flex;
  align-items: baseline;
}

/* 章节链接 */
.index a {
  color: #1a1a1a;
  text-decoration: none;
  flex-grow: 1;
}

.index a:hover {
  color: #000;
  text-decoration: underline;
}

/* 发布时间 */
.date {
  font-size: 14px;
  color: #999;
  margin-left: 20px;
  white-space: nowrap;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
</style>
</head>
<body>
<div class="container">
  <h1>我的小说标题</h1>
  <p class="author">作者：你的笔名</p>
  
  <ul class="index">
    <li>
      <a href="chapter-1.html">第一章　起始</a>
      <span class="date">2024-05-01</span>
    </li>
    <li>
      <a href="chapter-2.html">第二章　转折</a>
      <span class="date">2024-05-03</span>
    </li>
    <li>
      <a href="chapter-3.html">第三章　深渊</a>
      <span class="date">2024-05-06</span>
    </li>
  </ul>
</div>
</body>
</html>
